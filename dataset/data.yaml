# YOLO-pose dataset: one box per component + up to 4 keypoints marking its pins.
# Label line: class cx cy w h  x1 y1 v1  x2 y2 v2  x3 y3 v3  x4 y4 v4  (normalized, v=0 unused pin)
# No `path:` key — Ultralytics then resolves train/val relative to this file (train.py passes it absolute).
train: images/train
val: images/val
kpt_shape: [4, 3]
flip_idx: [0, 1, 2, 3]
names:
  0: wire
  1: resistor
  2: led
  3: capacitor
  4: button
  5: transistor
  6: pot
  7: battery
  8: ic_dip8
  9: ic_dip14
